# =============================================================================
# EXPERIENCE BANK - work experience and projects that are NOT on base_resume.tex
# =============================================================================
# The tailor decides per job whether to pull any of these onto the resume.
# Since the resume is one page, adding something here usually means the tailor
# drops or trims something else. That is intended.
#
# Rules:
#   - Every `id` must be unique across experience_bank.yaml, extra_bullets.yaml,
#     and facts.yaml.
#   - Write bullets as plain text. Literal % & $ _ may be written raw or escaped
#     (\% \& \$ \_); both work.
#   - `tags` are free-form hints. The tailor matches them against the job
#     description, so use words a job posting would actually contain.
#   - `notes` is context for the tailor's judgement only. It is NEVER copied
#     onto the resume verbatim - use it to explain scope, seniority, or when
#     this is and isn't worth including.
#   - Give each experience MORE bullets than would ever fit. The tailor picks
#     the best subset for each job.
#   - `requires_drop` (optional): an ordered list of what MUST be removed from
#     the resume if this entry is added. The first target still present is
#     removed - not a suggestion, this is enforced in code even if the model
#     forgets. Targets are resume entry ids (see --list-ids) or the sentinel
#     `jmu_coursework_and_awards`, which removes JMU's "Relevant Coursework"
#     and "Awards" bullets together as one unit. If two added entries both
#     list the same first-choice target, the second one falls through to its
#     next preference once the first is already gone.
# =============================================================================

experiences:
  - id: landmarks
    company: LandmarksCM
    title: AI Consultant
    dates: August 2025 - Present
    location: Reston, VA
    tags: [ai, llm, claude, genai, consulting, client-facing, forward-deployed, solutions-engineering, customer-facing, pre-sales, automation, prompt-engineering, adoption, advertising]
    notes: >
      Client-facing applied-AI consulting; the only current role. Add ONLY if
      the posting's CORE function is consulting, forward-deployed, solutions
      engineering, or customer-facing delivery - NOT a standard SWE posting
      that just lists communication/stakeholders/client-partnering as one
      requirement among many (most SWE postings do). Also fits AI/ML/GenAI
      adoption roles. Weak fit for pure infrastructure postings.
    requires_drop: [fantasy_stock_league, jmu_coursework_and_awards]
    bullets:
      - id: 2landmarks_adoption
        text: Led company-wide adoption of Claude across advertising documentation workflows, cutting 50+ hours of manual work per week and accelerating turnaround on campaigns supporting \$5M+ in annual ad buys
        tags: [claude, llm, genai, adoption, automation, business-impact, stakeholder]
      - id: 2landmarks_context
        text: Established context-management best practices that improved output accuracy and reduced token spend by 30\%
        tags: [llm, prompt-engineering, context-engineering, cost-optimization, evaluation, best-practices]

projects:
  - id: parallel_nbody
    name: Parallel-Nbody (Open Source Project)
    dates: March 2026 - May 2026
    tech: Python, C, C++
    link: ""
    tags: [hpc, parallel, distributed, mpi, c, cpp, python, performance, benchmarking, profiling, numpy, matplotlib, open-source, data-analysis]
    notes: >
      High-performance and parallel computing work. Best signal for postings
      that mention distributed systems, parallelism, performance engineering,
      C/C++, scientific computing, benchmarking, or data analysis and
      visualization. Also the only open-source contribution on file.
      No public link was provided, so the heading renders without one.
    requires_drop: [fantasy_stock_league, jmu_coursework_and_awards]
    bullets:
      - id: nbody_analysis
        text: Wrote Python scripts to analyze the performance of parallel C/C++ MPI algorithms, identifying a ~60\% runtime improvement between the worst and best algorithm at scale
        tags: [python, c, cpp, mpi, performance, profiling, data-analysis, parallel]
      - id: nbody_pipeline
        text: Built a benchmark pipeline for shared-memory weak scaling and distributed MPI sweeps, rendering them with a Python visualizer (NumPy/matplotlib) as plots
        tags: [benchmarking, mpi, distributed, numpy, matplotlib, visualization, pipeline, parallel]

  - id: fitcheck
    name: FitCheck
    dates: August 2026 - Present
    tech: Python, Claude API, LaTeX, YAML
    link: https://github.com/MichaelAho1/Resume_Tailorer
    tags: [ai, llm, claude, genai, llm-application, prompt-engineering, structured-output, guardrails, agents, automation, developer-tools, internal-tools, python, api-integration, cost-optimization, evaluation, json, parsing, cli, latex]
    notes: >
      Strongest signal for AI/LLM/GenAI application postings, agent or
      LLM-tooling work, and internal developer-tools roles. Also a fair
      general-SWE fit given the parser and validation layer. Skip for pure
      infrastructure, embedded, or data-engineering postings where QuickMarketz
      or Parallel-Nbody carry more signal. Solo personal project, so weaker
      evidence than the paid roles on team or scale.
    requires_drop: [fantasy_stock_league, jmu_coursework_and_awards]
    bullets:
      - id: fitcheck_guardrails
        text: Prevented fabricated content via 16 deterministic validation rules (source citation, metric preservation, 70\% token overlap floor), replacing an LLM self-check that falsely rejected 40\% of valid edits
        tags: [llm, guardrails, validation, hallucination, ai-safety, evaluation, correctness]
      - id: fitcheck_tokens
        text: Cut token cost by 75\% with a sparse-diff output format and model routing (Opus for planning, Sonnet for edits)
        tags: [llm, cost-optimization, model-routing, prompt-engineering, api-integration, performance]
      - id: fitcheck_feedback_loop
        text: Built a closed-loop generation cycle that grounds the model in a real compiler, parsing pdflatex page counts to re-prompt with a quantified trim target until output converges within 3 iterations
        tags: [agents, feedback-loop, llm, automation, verification, pipeline]
      - id: fitcheck_structured_output
        text: Hardened structured-output handling with a 4-candidate tolerant JSON decoder and error-class backoff retry, eliminating pipeline failures from non-conforming model responses
        tags: [structured-output, json, parsing, reliability, error-handling, api-integration, retry]
      - id: fitcheck_prompting
        text: Authored a 900+ word system prompt with schema contracts, few-shot examples, and explicit failure definitions, plus a banned-phrase list that suppresses LLM stylistic tells in generated prose
        tags: [prompt-engineering, llm, few-shot, schema, genai, nlp]
      - id: fitcheck_parser
        text: Wrote a dependency-free recursive-descent LaTeX parser with balanced-brace matching and lossless round-trip rendering, keeping the tool at 2 runtime dependencies across 2900 lines of Python
        tags: [python, parsing, compilers, ast, recursive-descent, data-structures, algorithms]
