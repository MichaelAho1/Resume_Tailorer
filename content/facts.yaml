# =============================================================================
# FACTS - true details too small to be their own bullet
# =============================================================================
# These are things the tailor can WEAVE INTO an existing bullet when the job
# calls for them, rather than add as a separate line. For example, a posting
# that asks for AI-assisted development can turn
#
#   "Migrated payments MCP tooling across 5 repos to TypeScript"
# into
#   "Migrated payments MCP tooling across 5 repos to TypeScript using Claude Code"
#
# Facts are only used when the posting makes them relevant. A fact that no job
# asks about simply never appears, which costs you nothing - so add every tool,
# language, and workflow you can honestly claim.
#
# `scope` controls where a fact may be used:
#   <entry id>  - only in bullets belonging to that entry (capital_one, ils,
#                 cross_screen_media, quickmarketz, fantasy_stock_league, or a
#                 bank entry id like 2landmarks)
#   global      - in any bullet, and in the skills lines
#   skills      - in the skills lines only
#
# `bullet_hint` optionally names which bullet a fact attaches to, for facts that
# are only true of one specific piece of work.
#
# Run `python tailor.py --list-ids` to print valid entry ids.
# Every `id` must be unique across all three content files.
# =============================================================================

facts:
  # --- cross-cutting -------------------------------------------------------
  - id: git_everywhere
    scope: global
    text: Git used for version control across every project and software engineering role
    tags: [git, version-control, github, source-control, collaboration]

